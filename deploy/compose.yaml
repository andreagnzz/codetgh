# CodeTgh hub and its Postgres, for one VPS. See docs/DEPLOY.md.
# Docker bypasses ufw: only the hub publishes a port, and only on 127.0.0.1. Public HTTPS comes from
# Tailscale Funnel (or a TLS proxy) pointing at http://127.0.0.1:8787; CODETGH_PUBLIC_URL is that https:// address.
# Run from the repository root: docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
name: codetgh
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: codetgh-hub:local
    environment:
      CODETGH_PUBLIC_URL: ${CODETGH_PUBLIC_URL:?set CODETGH_PUBLIC_URL in deploy/.env}
      CODETGH_SECRET: ${CODETGH_SECRET:?run codetgh setup to generate deploy/.env}
      DATABASE_URL: postgres://codetgh:${POSTGRES_PASSWORD:?missing}@db:5432/codetgh
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      CODETGH_AUDIT_KEY: ${CODETGH_AUDIT_KEY:-}
      CODETGH_TRUSTED_PROXY: ${CODETGH_TRUSTED_PROXY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    user: "1000:1000" # node, from the image
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
  # Optional: only starts with --profile discord. It sees neither the hub nor its data, and holds no token.
  discord:
    profiles: [discord]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: discord-bot
    image: codetgh-discord-bot:local
    environment:
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      CODETGH_REPO: ${CODETGH_REPO:-andreagnzz/codetgh}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    ports:
      - "127.0.0.1:8790:8790"
    restart: unless-stopped
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: codetgh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: codetgh
    # Runs as the image's postgres user from the start; no port is published, only the hub reaches it.
    user: "999:999"
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetgh"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
